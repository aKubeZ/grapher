<!DOCTYPE html>

<html>
    <head>
        <title>graph</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        <div id="maincontainer">
            <div id="funccontainer">
                <div id="controls">
                    <div class="button" id="update">update!</div>
                    <!-- <div class="button">poopoo</div> -->
                </div>
                <div id="entrylist">
                    <!-- <div class="entry">$$e^x$$</div>
                    <div class="entry"></div> -->
                </div>
            </div>
            <div id="graphcontainer">
                <canvas id="graph"></canvas>
                <p id="error">if you're reading this right now in your browser then something is not working check dev tools or something <br> probably bc its not a server tho </p>
            </div>
        </div>

        <!-- mathjax -->
        <script>
            MathJax = {
                tex: {
                    packages: {'[+]': ['bbox']},
                    macros: {
                        dd: "{\\,\\mathrm{d}}",
                        dint: ["{\\int_{#1}^{#2}}", 2]
                    }
                },
                loader: {
                    load: ['output/svg', '[tex]/bbox']
                },
                svg: {
                    displayAlign: "left",
                },
                options: {
                    enableMenu: false,
                    menuOptions: {
                        settings: {
                            enrich: false,         // true to enable semantic-enrichment
                            collapsible: false,   // true to enable collapsible math
                            speech: false,         // true to enable speech generation
                            braille: false,        // true to enable Braille generation
                            assistiveMml: false,  // true to enable assistive MathML
                        }
                    }
                }
            };
        </script>
        <!-- <script defer id="MathJax-script" src="./lib/mathjax/tex-chtml.js"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js" defer></script>
        <script defer src="./js/loader.js" type="module"></script>
    </body>
</html>
