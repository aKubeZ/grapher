<!DOCTYPE html>

<html>
    <head>
        <title>graph</title>
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        <div id="maincontainer">
            <div id="funccontainer">
                <div id="controls">
                    <div class="button" id="update">update!</div>
                    <!-- <div class="button">poopoo</div> -->
                </div>
                <div id="entrylist">
                    <!-- <div class="entry">$$e^x$$</div>
                    <div class="entry"></div> -->
                </div>
            </div>
            <div id="graphcontainer">
                <canvas id="graph"></canvas>
                <p id="error">if you're reading this right now in your browser then something is not working check dev tools or something <br> probably bc its not a server tho </p>
            </div>
        </div>

        <!-- mathjax -->
        <script>
            MathJax = {
                loader: {
                    load: ['[tex]/bbox']
                },
                tex: {
                    packages: {'[+]': ['bbox']},
                    macros: {
                        // cursor: "{\\mkern -1mu \\raise{0.1ex}{\\Large \\vert} \\mkern -1mu}",
                        cursor: "{\\mkern -2.5mu \\raise{0.2ex}{\\vert \\mkern -4.5mu \\vert} \\mkern -2.5mu}",
                        selection: ["{\\bbox[#870099, 1pt]{ #1 }}", 1], // not used bc it doenst work fro some reason
                        dd: "{\\,\\mathrm{d}}",
                        dint: ["{\\int_{#1}^{#2}{#3}\\,\\dd{#4}\\,}", 4],
                        negskip: "\\hskip -2mu",
                        paren: ["{\\negskip \\left( #1 \\right) \\negskip}", 1],
                        brack: ["{\\left[ #1 \\right]}", 1],
                        brace: ["{\\left\\{ #1 \\right\\}}", 1],
                        verts: ["{\\left\\lvert #1 \\right\\rvert}", 1],
                    }
                },
                svg: {
                    displayAlign: "left",
                },
                options: {
                    enableMenu: false,
                    menuOptions: {
                        settings: {
                            enrich: false,         // true to enable semantic-enrichment
                            collapsible: false,   // true to enable collapsible math
                            speech: false,         // true to enable speech generation
                            braille: false,        // true to enable Braille generation
                            assistiveMml: false,  // true to enable assistive MathML
                        }
                    }
                }
            };
        </script>
        <!-- <script defer id="MathJax-script" src="./lib/mathjax/tex-chtml.js"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js" defer></script>
        <script defer src="./js/main.js" type="module"></script>
    </body>
</html>
